landing.testimonial1.name=Emma Martinez
landing.testimonial1.role=Exchange Student, University of Barcelona
landing.testimonial1.text=GoTogether helped me connect with other students before I even arrived in Barcelona. I made friends from day one and had an incredible exchange experience thanks to the connections I made here.
