# Conflict / invalid / auth exceptions
exception.CityAlreadyExistsException=A city with that name already exists in that country
exception.CareerAlreadyExistsException=A career with that name already exists
exception.UniversityAlreadyExistsException=A university with that name already exists in that city
exception.EventIsFullException=This event is already full
exception.AttendeesLimitBelowCurrentException=The maximum number of attendees cannot be reduced because more people are already registered than the entered number.
exception.EventNotInTheFutureException=The event date must be in the future
exception.EventNotOccurredException=You can only rate events that have already occurred
exception.EventAttendanceRequiredException=You can only rate events you attended
exception.UserAlreadyAttendingException=The user is already attending this event
exception.UserNotVerifiedException=Your account has not been verified yet
exception.UserValidatedException=The user account has already been validated
exception.UserWithActiveJourneyException=The user already has an active journey
exception.ExpiredTokenException=The token has expired
exception.InvalidTokenException=The token is invalid
exception.InvalidDateException=The provided date is invalid
exception.InvalidPaginationParamsException=Invalid pagination parameters
exception.InvalidReferenceException=The referenced resource is invalid
exception.MutuallyExclusiveException=The provided options are mutually exclusive
exception.MutuallyExclusiveFiltersException=The provided filters are mutually exclusive

