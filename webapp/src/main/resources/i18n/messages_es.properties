exception.UserNotVerifiedException=Tu cuenta aún no ha sido verificada
exception.UserValidatedException=La cuenta del usuario ya fue validada
exception.UserWithActiveJourneyException=El usuario ya tiene un viaje activo
exception.InvalidImageException=La imagen proporcionada no es válida
