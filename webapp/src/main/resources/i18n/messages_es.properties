exception.CityAlreadyExistsException=Ya existe una ciudad con ese nombre en ese país
exception.CareerAlreadyExistsException=Ya existe una carrera con ese nombre
exception.UniversityAlreadyExistsException=Ya existe una universidad con ese nombre en esa ciudad
exception.EventIsFullException=El evento ya está completo
exception.AttendeesLimitBelowCurrentException=No se puede reducir el máximo de participantes porque hay más personas registradas que el número ingresado.
