<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.journey.deletion.title}">Your Journey Has Been Removed</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; color: #333; margin: 0;">
<div style="text-align: center; margin-bottom: 30px;">
    <a href="${baseUrl}" style="text-decoration: none;">
        <h1 style="font-size: 28px; font-weight: bold; color: #000000; margin: 0;">
            Go<span style="color: #3366ff;">Together</span>
        </h1>
    </a>
    <h2 th:text="#{email.journey.deletion.heading}">Your journey has been removed</h2>
</div>
<div style="background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #333;">
    <div style="margin-bottom: 20px;">
        <h3 th:text="#{email.journey.deletion.journey.title}" style="margin: 0 0 10px 0; font-size: 18px;">Journey: Journey Title</h3>
    </div>

    <p th:text="#{email.journey.deletion.explanation}" style="margin-bottom: 20px;">
        Your journey has been removed by an administrator because it violated our community guidelines.
    </p>

    <div style="background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #ff3333;">
        <h4 th:text="#{email.journey.deletion.reason.heading}" style="margin-top: 0; margin-bottom: 10px; color: #333;">Reason for removal:</h4>
        <p style="margin: 0; font-style: italic; color: #333;" th:text="${adminMessage}">Admin message explaining the reason for deletion goes here</p>
    </div>

    <div style="text-align: center; margin-top: 40px;">
        <a th:href="@{${baseUrl + 'journeys/create'}}"
           style="display: inline-block; background-color: #3366ff; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold;"
           th:text="#{email.journey.deletion.cta}">
            Get your journey back online
        </a>
    </div>

</div>

</body>
</html>
