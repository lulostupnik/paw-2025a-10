<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.journey.comment.notification.title}">New Comment on Journey</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; color: #333; margin: 0;">
<div style="text-align: center; margin-bottom: 30px;">
    <a th:href="${baseUrl}" style="text-decoration: none;">
        <h1 style="font-size: 28px; font-weight: bold; color: #000000; margin: 0;">
            Go<span style="color: #3366ff;">Together</span>
        </h1>
    </a>
    <h2 th:text="#{email.journey.comment.notification.new.comment}">New comment on a journey you're following</h2>
</div>
<div style="background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #333;">

    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-bottom: 20px;">
        <tr>
            <td width="70" valign="top" th:if="${hasProfileImage}" style="padding-right: 15px;">
                <img th:src="'cid:profileImage'" alt="Profile Picture"
                     style="width: 60px; height: 60px; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.2); object-fit: cover;" />
            </td>
            <td valign="top">
                <h3 style="margin: 0; font-size: 18px;">
                    <span th:text="#{email.journey.comment.notification.user.commented(${firstname}, ${lastname})}">User has commented</span>
                </h3>

                <p style="margin: 5px 0 0 0; color: #666;">
                    <span th:text="${username}">username</span> •
                    <span th:text="${university}">University</span> •
                    <span th:text="${career}">Career</span>
                </p>
            </td>
        </tr>
    </table>

    <div style="background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #3366ff;">
        <p style="margin: 0; font-style: italic; color: #333;" th:text="${message}">Comment message goes here</p>
    </div>

    <div style="text-align: center; margin-top: 40px;">
        <a th:href="@{${baseUrl + 'journeys/{journeyId}'}(journeyId=${journeyId})}"
           style="display: inline-block; background-color: #3366ff; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold;"
           th:text="#{email.journey.comment.notification.cta.view.comments}">
            View all comments
        </a>
    </div>
</div>

</body>
</html>
