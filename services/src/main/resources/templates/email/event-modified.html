<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.event.modification.title}">Your Event Has Been Modified</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; color: #333; margin: 0;">
<div style="text-align: center; margin-bottom: 30px;">
    <a href="http://pawserver.it.itba.edu.ar/paw-2025a-10/" style="text-decoration: none;">
        <h1 style="font-size: 28px; font-weight: bold; color: #000000; margin: 0;">
            Go<span style="color: #3366ff;">Together</span>
        </h1>
    </a>
    <h2 th:text="#{email.event.modification.heading}">Your event has been modified</h2>
</div>
<div style="background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #333;">
    <div style="margin-bottom: 20px;">
        <h3 th:text="#{email.event.modification.event.title(${eventTitle})}" style="margin: 0 0 10px 0; font-size: 18px;">Event: Event Title</h3>
    </div>

    <p th:text="#{email.event.modification.explanation}" style="margin-bottom: 20px;">
        Your event has been modified by an administrator because some content violated our community guidelines.
    </p>

    <div style="background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #ffaa33;">
        <h4 th:text="#{email.event.modification.reason.heading}" style="margin-top: 0; margin-bottom: 10px; color: #333;">Reason for modification:</h4>
        <p style="margin: 0; font-style: italic; color: #333;" th:text="${adminMessage}">Admin message explaining the reason for modification goes here</p>
    </div>

    <div style="text-align: center; margin-top: 40px;">
        <a th:href="@{http://pawserver.it.itba.edu.ar/paw-2025a-10/events/{eventId}/update(eventId=${eventId})}"
           style="display: inline-block; background-color: #3366ff; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold;"
           th:text="#{email.event.modification.cta}">
            Edit your event
        </a>
    </div>
</div>

</body>
</html>
