<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.reset.title}"></title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; color: #333; margin: 0;">
<div style="text-align: center; margin-bottom: 30px;">
    <a th:href="${baseUrl}" style="text-decoration: none;">
        <h1 style="font-size: 28px; font-weight: bold; color: #000000; margin: 0;">
            Go<span style="color: #3366ff;">Together</span>
        </h1>
    </a>
    <h2 th:text="#{email.reset.heading}"></h2>
</div>
<div style="background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #333;">
    <p th:text="#{email.reset.greeting(${firstName})}" style="margin-bottom: 20px;">
    </p>

    <p th:text="#{email.reset.explanation}" style="margin-bottom: 20px;">
    </p>

    <p th:text="#{email.reset.instructions}" style="margin-bottom: 20px;">
    </p>

    <div style="text-align: center; margin-top: 40px;">
        <a th:href="@{${baseUrl + 'reset-password'}(token=${resetToken})}"
           style="display: inline-block; background-color: #3366ff; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold;"
           th:text="#{email.reset.cta}">
        </a>
    </div>

    <p th:text="#{email.reset.ignore}" style="margin-top: 30px; font-size: 14px; color: #666;">
    </p>

</div>

<div style="margin-top: 30px; text-align: center; color: #666; font-size: 14px;">
    <p th:text="#{email.footer.message}">
    </p>
    <p th:text="#{email.reset.expiry}">
    </p>
    <p th:text="#{email.reset.security}" style="font-style: italic;">
    </p>
</div>

</body>
</html>
